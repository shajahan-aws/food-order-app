version: '3.8'

services:
  db:
    image: postgres:15-alpine
    # container_name: food-db  <-- Removed static name to prevent conflicts
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-food_db}
      POSTGRES_USER: ${POSTGRES_USER:-food_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-food_secret_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-food_user} -d ${POSTGRES_DB:-food_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  order-api:
    build:
      context: .
      dockerfile: Dockerfile
    # container_name: food-order-api <-- Removed static name
    restart: always
    ports:
      - "5000:5000"  # <-- Added port mapping for Jenkins health check
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-food_db}
      POSTGRES_USER: ${POSTGRES_USER:-food_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-food_secret_password}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    # container_name: food-nginx-proxy <-- Removed static name
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - order-api
    networks:
      - app-network

volumes:
  postgres_data:
    name: food_postgres_data

networks:
  app-network:
    driver: bridge